name: Backend (build + deploy)

# Phase 0: build the Nados API image and deploy a permanent backend.
# The web bundle is built first (the image copies dist). Image is pushed to GHCR;
# deployment runs only if the matching deploy secret is configured.
on:
  workflow_dispatch:
  push:
    branches: [main, master]
    paths:
      - 'nados-ai-web/server/**'
      - 'nados-ai-web/package.json'
      - 'nados-ai-web/Dockerfile'

jobs:
  image:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    defaults:
      run:
        working-directory: nados-ai-web
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: nados-ai-web/package-lock.json

      - run: npm ci || npm install
      - run: npm run build

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: ./nados-ai-web
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/nados-api:latest
            ghcr.io/${{ github.repository_owner }}/nados-api:${{ github.sha }}

  deploy-render:
    needs: image
    runs-on: ubuntu-latest
    if: ${{ secrets.RENDER_DEPLOY_HOOK != '' }}
    steps:
      - name: Trigger Render deploy
        run: curl -fsS -X POST "${{ secrets.RENDER_DEPLOY_HOOK }}"

  deploy-fly:
    needs: image
    runs-on: ubuntu-latest
    if: ${{ secrets.FLY_API_TOKEN != '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: superfly/flyctl-actions/setup-flyctl@master
      - run: flyctl deploy --remote-only
        working-directory: nados-ai-web
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
